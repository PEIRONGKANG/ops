<svg width="1600" height="560" viewBox="0 0 1600 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">创意饮品海报示意图</title>
  <desc id="desc">用于周三创意饮品策划提交模块的横版效果图，展示创意饮品海报、饮品杯和柑橘元素。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf2dd"/>
      <stop offset="55%" stop-color="#f1e7cf"/>
      <stop offset="100%" stop-color="#dfeff2"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f7eedb"/>
    </linearGradient>
    <linearGradient id="poster" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a6f97"/>
      <stop offset="100%" stop-color="#245d80"/>
    </linearGradient>
    <linearGradient id="drink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc96a"/>
      <stop offset="100%" stop-color="#f28b3c"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dbf84"/>
      <stop offset="100%" stop-color="#3f7d4f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff3b0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#b6965e" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1600" height="560" fill="url(#bg)"/>
  <circle cx="1380" cy="110" r="150" fill="url(#glow)"/>
  <circle cx="150" cy="470" r="120" fill="#ffffff" fill-opacity="0.28"/>
  <circle cx="1510" cy="480" r="90" fill="#ffffff" fill-opacity="0.22"/>

  <g opacity="0.28">
    <path d="M0 438 C180 390 310 398 470 446 C610 488 760 504 955 468 C1132 434 1335 368 1600 420 L1600 560 L0 560 Z" fill="#d8e7de"/>
    <path d="M0 462 C176 430 344 448 506 486 C668 522 794 528 1000 488 C1192 450 1376 410 1600 454 L1600 560 L0 560 Z" fill="#c8ddd6"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="118" y="88" width="1364" height="384" rx="34" fill="url(#card)" stroke="#d8c29a" stroke-width="3"/>
  </g>

  <g transform="translate(170 134)">
    <rect x="0" y="0" width="340" height="286" rx="24" fill="url(#poster)"/>
    <rect x="24" y="24" width="292" height="238" rx="18" fill="#f7fbff" fill-opacity="0.14" stroke="#f9e7c0" stroke-opacity="0.8"/>
    <text x="38" y="64" font-size="20" font-family="'Microsoft YaHei','微软雅黑',sans-serif" fill="#f9e7c0" letter-spacing="3">CREATIVE DRINK</text>
    <text x="38" y="112" font-size="42" font-family="'Microsoft YaHei','微软雅黑',sans-serif" fill="#ffffff" font-weight="700">柑橘气泡冰茶</text>
    <text x="38" y="148" font-size="20" font-family="'Microsoft YaHei','微软雅黑',sans-serif" fill="#d8edf7">清爽果香 / 冷饮主推 / 视觉海报</text>
    <rect x="38" y="186" width="124" height="34" rx="17" fill="#ffd07b"/>
    <text x="100" y="209" text-anchor="middle" font-size="18" font-family="'Microsoft YaHei','微软雅黑',sans-serif" fill="#5f3c12" font-weight="700">本周主推</text>
    <rect x="192" y="186" width="86" height="34" rx="17" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.6"/>
    <text x="235" y="209" text-anchor="middle" font-size="18" font-family="'Microsoft YaHei','微软雅黑',sans-serif" fill="#ffffff">¥ 18</text>
    <circle cx="265" cy="102" r="32" fill="#ffd07b" fill-opacity="0.92"/>
    <circle cx="286" cy="128" r="20" fill="#fff2cc" fill-opacity="0.9"/>
    <path d="M248 96 C263 74 294 74 307 98" fill="none" stroke="#ffe8a7" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(620 126)">
    <ellipse cx="268" cy="288" rx="236" ry="40" fill="#9e7d56" fill-opacity="0.18"/>
    <rect x="126" y="40" width="170" height="214" rx="32" fill="#fff5e8" stroke="#e4c8a6" stroke-width="4"/>
    <path d="M132 92 C180 70 240 68 290 90 L290 208 C242 228 184 228 132 206 Z" fill="url(#drink)"/>
    <rect x="144" y="28" width="134" height="24" rx="12" fill="#f3dec4"/>
    <path d="M308 84 C350 82 366 128 330 156 C315 168 300 170 290 170" fill="none" stroke="#e4c8a6" stroke-width="12" stroke-linecap="round"/>
    <path d="M216 18 L246 -22" stroke="#52a37b" stroke-width="12" stroke-linecap="round"/>
    <path d="M240 16 L282 -34" stroke="#8ed08e" stroke-width="8" stroke-linecap="round"/>
    <circle cx="178" cy="128" r="26" fill="#ffe59a" fill-opacity="0.58"/>
    <circle cx="252" cy="160" r="20" fill="#fff3c2" fill-opacity="0.44"/>
    <path d="M214 46 C234 30 260 28 286 40" fill="none" stroke="#f3dec4" stroke-width="8" stroke-linecap="round"/>
    <path d="M120 44 C84 28 54 44 40 70 C24 104 38 136 72 144" fill="none" stroke="url(#leaf)" stroke-width="13" stroke-linecap="round"/>
    <path d="M320 34 C350 18 384 32 396 58 C408 82 396 112 366 122" fill="none" stroke="url(#leaf)" stroke-width="13" stroke-linecap="round"/>
  </g>

  <g transform="translate(1110 132)">
    <circle cx="120" cy="150" r="86" fill="#ffbf5a"/>
    <circle cx="120" cy="150" r="68" fill="#ffd781"/>
    <circle cx="120" cy="150" r="60" fill="#fff0bb"/>
    <path d="M120 90 L120 210" stroke="#ffcf71" stroke-width="4"/>
    <path d="M60 150 L180 150" stroke="#ffcf71" stroke-width="4"/>
    <path d="M80 108 L160 192" stroke="#ffcf71" stroke-width="4"/>
    <path d="M160 108 L80 192" stroke="#ffcf71" stroke-width="4"/>

    <circle cx="252" cy="90" r="44" fill="#ffd781"/>
    <circle cx="252" cy="90" r="28" fill="#fff0bb"/>
    <path d="M248 42 C266 16 298 20 314 44" fill="none" stroke="#5a9f67" stroke-width="10" stroke-linecap="round"/>
    <path d="M288 40 C316 38 336 54 342 82" fill="none" stroke="#7fbe7f" stroke-width="7" stroke-linecap="round"/>

    <text x="22" y="286" font-size="34" font-family="'Microsoft YaHei','微软雅黑',sans-serif" fill="#8c5e20" font-weight="700">海报视觉区</text>
    <text x="22" y="324" font-size="20" font-family="'Microsoft YaHei','微软雅黑',sans-serif" fill="#7c6a55">可替换为学生成品海报或饮品渲染图</text>
    <rect x="20" y="350" width="230" height="40" rx="20" fill="#2a9d8f" fill-opacity="0.16" stroke="#2a9d8f" stroke-opacity="0.45"/>
    <text x="135" y="376" text-anchor="middle" font-size="19" font-family="'Microsoft YaHei','微软雅黑',sans-serif" fill="#20685f">策划提交示意</text>
  </g>
</svg>
