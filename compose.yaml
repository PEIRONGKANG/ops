services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beverage_ops}
      POSTGRES_USER: ${POSTGRES_USER:-beverage_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "55433:5432"
    volumes:
      - beverage_ops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./apps/backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-beverage_ops}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-beverage_ops}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set}
      AUTH_TOKEN_HMAC_SECRET: ${AUTH_TOKEN_HMAC_SECRET:?AUTH_TOKEN_HMAC_SECRET must be set}
      AUTH_BOOTSTRAP_P1_LOGIN_ID: ${AUTH_BOOTSTRAP_P1_LOGIN_ID:?AUTH_BOOTSTRAP_P1_LOGIN_ID must be set}
      AUTH_BOOTSTRAP_P1_TEMP_PASSWORD: ${AUTH_BOOTSTRAP_P1_TEMP_PASSWORD:?AUTH_BOOTSTRAP_P1_TEMP_PASSWORD must be set}
      AUTH_BOOTSTRAP_P1_CLAIM_SECRET: ${AUTH_BOOTSTRAP_P1_CLAIM_SECRET:?AUTH_BOOTSTRAP_P1_CLAIM_SECRET must be set}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://localhost:5173}
      AUTH_SECURE_COOKIES: ${AUTH_SECURE_COOKIES:-true}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18080:8080"

volumes:
  beverage_ops_postgres_data:
