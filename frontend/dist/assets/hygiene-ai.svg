<svg width="1600" height="560" viewBox="0 0 1600 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">每日打卡与运营执行示意图</title>
  <desc id="desc">用于每日打卡与运营执行模块的横版效果图，展示卫生检查、出勤打卡和开闭店巡检主题。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4ea"/>
      <stop offset="55%" stop-color="#dcebe7"/>
      <stop offset="100%" stop-color="#f7ecd8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf9"/>
      <stop offset="100%" stop-color="#f4ede0"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#264653"/>
      <stop offset="100%" stop-color="#2a9d8f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d18c"/>
      <stop offset="100%" stop-color="#d89c49"/>
    </linearGradient>
    <linearGradient id="spray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7bc4d6"/>
      <stop offset="100%" stop-color="#2a6f97"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#8b7c64" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1600" height="560" fill="url(#bg)"/>
  <circle cx="1350" cy="110" r="130" fill="#fff5d8" fill-opacity="0.75"/>
  <circle cx="180" cy="470" r="90" fill="#ffffff" fill-opacity="0.3"/>
  <circle cx="1510" cy="420" r="70" fill="#ffffff" fill-opacity="0.22"/>

  <g opacity="0.18">
    <path d="M0 430 C220 382 404 390 560 438 C714 486 884 494 1072 456 C1244 422 1402 380 1600 412 L1600 560 L0 560 Z" fill="#cfded5"/>
    <path d="M0 458 C186 430 360 446 520 484 C690 522 852 520 1058 478 C1258 438 1420 404 1600 438 L1600 560 L0 560 Z" fill="#d8e7de"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="118" y="88" width="1364" height="384" rx="34" fill="url(#panel)" stroke="#d6c29b" stroke-width="3"/>
  </g>

  <g transform="translate(158 126)">
    <rect x="0" y="0" width="360" height="296" rx="26" fill="url(#board)"/>
    <rect x="24" y="24" width="312" height="248" rx="18" fill="#ffffff" fill-opacity="0.12" stroke="#f3e6c8" stroke-opacity="0.7"/>
    <text x="36" y="62" font-size="20" font-family="'Microsoft YaHei','微软雅黑',sans-serif" fill="#f8e8c4" letter-spacing="3">DAILY OPS CHECK</text>
    <text x="36" y="114" font-size="40" font-family="'Microsoft YaHei','微软雅黑',sans-serif" fill="#ffffff" font-weight="700">卫生检查与出勤确认</text>
    <text x="36" y="156" font-size="21" font-family="'Microsoft YaHei','微软雅黑',sans-serif" fill="#dceef2">仪容仪表 / 开闭店卫生 / 库存巡检</text>
    <g transform="translate(36 192)">
      <rect x="0" y="0" width="120" height="38" rx="19" fill="#ffd07b"/>
      <text x="60" y="25" text-anchor="middle" font-size="18" font-family="'Microsoft YaHei','微软雅黑',sans-serif" fill="#5f3c12" font-weight="700">每日执行</text>
      <rect x="140" y="0" width="130" height="38" rx="19" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.55"/>
      <text x="205" y="25" text-anchor="middle" font-size="18" font-family="'Microsoft YaHei','微软雅黑',sans-serif" fill="#ffffff">经理复核</text>
    </g>
    <path d="M258 72 L304 118 L322 96" fill="none" stroke="#f8e8c4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

